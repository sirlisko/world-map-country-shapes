name: Publish

on:
  release:
    types: [published]

permissions:
  contents: read
  # Trusted publishing: npm verifies this workflow via OIDC, so no NPM_TOKEN
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # `npm stage` needs npm 11.15+, bundled with current Node 24
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Check the tag matches package.json
        run: test "${GITHUB_REF_NAME#v}" = "$(node -p 'require("./package.json").version')"
      - run: npm test
      # Stage only: a maintainer approves the release on npmjs.com with 2FA
      - run: npm stage publish
